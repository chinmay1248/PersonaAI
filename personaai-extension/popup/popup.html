<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PersonaAI</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <img src="../icons/icon48.png" alt="" width="36" height="36">
        <div>
          <h1>PersonaAI</h1>
          <p id="statusText">Loading...</p>
        </div>
      </header>

      <section class="panel" id="authPanel">
        <form id="authForm">
          <label>
            Email
            <input id="emailInput" type="email" autocomplete="email" required value="demo@persona.ai">
          </label>
          <label>
            Password
            <input id="passwordInput" type="password" autocomplete="current-password" required value="StrongPass123">
          </label>
          <div class="button-row">
            <button class="button primary" type="submit">Sign in</button>
            <button class="button" type="button" id="registerButton">Register</button>
          </div>
        </form>
      </section>

      <section class="panel is-hidden" id="actionPanel">
        <div class="action-grid">
          <button class="button primary" type="button" id="replyButton">Generate replies</button>
          <button class="button" type="button" id="summaryButton">Summarize</button>
          <button class="button" type="button" id="trainButton">Train tone</button>
          <button class="button muted" type="button" id="logoutButton">Sign out</button>
        </div>
      </section>

      <section class="panel">
        <details>
          <summary>Settings</summary>
          <form id="settingsForm" class="settings-form">
            <label>
              Backend URL
              <input id="apiBaseUrlInput" type="url" required>
            </label>
            <label>
              Replies
              <input id="suggestionCountInput" type="number" min="1" max="5" step="1">
            </label>
            <label>
              Personality
              <select id="personalityInput">
                <option value="funny">Funny</option>
                <option value="serious">Serious</option>
                <option value="romantic">Romantic</option>
                <option value="savage">Savage</option>
              </select>
            </label>
            <button class="button" type="submit">Save settings</button>
            <button class="button muted" type="button" id="healthButton">Test connection</button>
          </form>
        </details>
      </section>

      <section class="results" id="results" aria-live="polite"></section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
