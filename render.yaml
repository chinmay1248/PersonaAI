services:
  - type: web
    name: personaai-backend
    runtime: docker
    rootDir: personaai-backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: personaai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: CORS_ALLOWED_ORIGIN_REGEX
        value: "chrome-extension://.*"
      - key: ENABLE_LLM
        value: "true"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_CHAT_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_FAST_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_API_KEY
        sync: false

databases:
  - name: personaai-db
    plan: free
